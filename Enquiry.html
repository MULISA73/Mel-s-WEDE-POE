<!DOCTYPE html>
<html>

        <title>Enquiry</title>

    <body>
        <body bgcolor="lightpink">
         <nav>

    <a href="INDEX.html">Home</a>
    <a href="About.html">About Us</a>
    <a href="products.html">Products</a>
    <a href="enquiry.html">Enquiry</a>

<section id="order">

    <h2>Request a Quote</h2>

    <p>
        Complete the form below to request a quotation.
    </p>


    <form>

        <label for="name">
            Full Name:
        </label>

        <br>

        <input type="text"
               id="name"
               name="name"
               required>

        <br><br>


        <label for="phone">
            Phone Number:
        </label>

        <br>

        <input type="tel"
               id="phone"
               name="phone"
               required>

        <br><br>


        <label for="email">
            Email Address:
        </label>

        <br>

        <input type="email"
               id="email"
               name="email"
               required>

        <br><br>


        <label for="date">
            Event Date:
        </label>

        <br>

        <input type="date"
               id="date"
               name="date">

        <br><br>


        <label for="product">
            Product Required:
        </label>

        <br>

        <select id="product"
                name="product">

            <option>Custom Cake</option>
            <option>Wedding Cake</option>
            <option>Cupcakes</option>
            <option>Cookies</option>
            <option>Dessert Box</option>

        </select>

        <br><br>


        <label for="flavour">
            Preferred Flavour:
        </label>

        <br>

        <select id="flavour"
                name="flavour">

            <option>Chocolate</option>
            <option>Vanilla</option>
            <option>Red Velvet</option>
            <option>Carrot</option>
            <option>Lemon</option>

        </select>

        <br><br>


        <label for="message">
            Additional Requirements:
        </label>

        <br>

        <textarea id="message"
                  name="message"
                  rows="6"
                  cols="40"></textarea>

        <br><br>


        <input type="submit"
               value="Submit Quote Request">

    </form>

</section>

    </body>
