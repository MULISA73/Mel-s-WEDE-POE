    <main>
        <section class="form-section" id="order">
            <h1>Request a Enquiry</h1>
            <p>Complete the form below to complete your enquiry.</p>

            <form action="#" method="post">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="message">Additional Requirements</label>
                    <textarea id="message" name="message" rows="4" required></textarea>
                </div>

                <div class="form-actions">
                    <input type="submit" value="Submit Enquiry Request">
                    <input type="reset" value="Clear Form">
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Mel's Cakes &amp; Treats. All rights reserved.</p>
    </footer>
